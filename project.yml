name: Claudoscope
options:
  bundleIdPrefix: com.claudoscope
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    from: "1.1.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: "7.11.1"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: "0.12.1"

targets:
  Claudoscope:
    type: application
    platform: macOS
    sources:
      - path: Claudoscope
        excludes:
          - Info.plist
          - Resources/HardeningBaseline
          - Resources/RoutingStack
          - .claude
      - path: Claudoscope/Resources/HardeningBaseline
        type: folder
        buildPhase: resources
      - path: Claudoscope/Resources/RoutingStack
        type: folder
        buildPhase: resources
      - path: CHANGELOG.md
        type: file
        buildPhase: resources
    info:
      path: Claudoscope/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleName: Claudoscope
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppleEventsUsageDescription: "Claudoscope focuses your terminal window when you click a session notification."
    dependencies:
      - package: swift-collections
        product: OrderedCollections
      - package: GRDB
        product: GRDB
      - package: MCP
        product: MCP
      - target: ClaudoscopeMcpShim
        embed: true
        codeSign: true
        copy:
          destination: executables
    entitlements:
      path: Claudoscope/Claudoscope.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.claudoscope.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "DN8M2CQ4D2"
        PRODUCT_NAME: Claudoscope
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Claudoscope/Info.plist
        CODE_SIGN_ENTITLEMENTS: Claudoscope/Claudoscope.entitlements
        ENABLE_HARDENED_RUNTIME: true
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false

  ClaudoscopeMcpShim:
    type: tool
    platform: macOS
    sources:
      - path: McpShim
    settings:
      base:
        PRODUCT_NAME: claudoscope-mcp
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "DN8M2CQ4D2"
        ENABLE_HARDENED_RUNTIME: true
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        SKIP_INSTALL: true

  ClaudoscopeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudoscopeTests
    dependencies:
      - target: Claudoscope
      - package: GRDB
        product: GRDB
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false

schemes:
  Claudoscope:
    build:
      targets:
        Claudoscope: all
        ClaudoscopeTests: [test]
    test:
      targets:
        - ClaudoscopeTests
